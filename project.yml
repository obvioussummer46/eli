# Fallback / regeneration recipe:  brew install xcodegen && xcodegen generate
name: SchulportalMobile
options:
  bundleIdPrefix: de.schulportalmobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
targets:
  SchulportalMobile:
    type: application
    platform: iOS
    sources:
      - path: SchulportalMobile
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.schulportalmobile.app
        DEVELOPMENT_TEAM: 42436Y52QF
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Schulportal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Damit dein Stundenplan als Termine in deinen iOS-Kalender geschrieben werden kann."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Damit dein Stundenplan als Termine in deinen iOS-Kalender geschrieben werden kann."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
